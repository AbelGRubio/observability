[project]
name = "observe-core"
version = "0.1.3-rc.1"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.12.0",
    "python-keycloak>=5.3.0",
    "fastapi>=0.115.12",
    "psutil>=7.0.0",
    "py-cpuinfo>=9.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pyjwt>=2.12.1",
    "aws-opentelemetry-distro>=0.10.1",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "opentelemetry-sdk",
    "orjson>=3.11.9",
]

[project.optional-dependencies]
rich = [
   "rich >=14.1.0",
]

#[dependency-groups]
#dev = [
#    "pre-commit==4.5.1",
